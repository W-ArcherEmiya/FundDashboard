<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资产看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css', v=asset_version) }}">
</head>
<body>

<div id="refreshBar" class="refresh-bar"></div>

<div class="main-container">
    <div class="nav-header">
        <ul class="nav nav-tabs" id="fundTabs"></ul>
        <div class="nav-actions">
            <button class="btn-sync" data-action="open-sync">同步</button>
        </div>
    </div>
    <div id="noticeArea" class="notice-area" aria-live="polite"></div>
    <div id="contentArea"></div>
</div>

<div class="modal fade" id="syncModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg modal-shell">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold modal-title-main">数据同步</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <div class="mb-3">
                    <label class="form-label form-label-soft">专属同步码</label>
                    <input type="text" class="form-control" id="syncCodeInput" placeholder="输入任意字符作为暗号(如手机号)">
                    <div class="form-text mt-2 sync-help-text">在不同设备输入相同的同步码，即可互通数据。</div>
                </div>
                <div class="d-flex gap-3 mt-4">
                    <button class="btn btn-light w-100 fw-bold btn-sync-upload" data-action="upload-sync" id="btnUpload">覆盖到云端</button>
                    <button class="btn w-100 fw-bold btn-sync-download" data-action="download-sync" id="btnDownload">下载到本地</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg modal-shell">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold modal-title-main">资产管理</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form id="fundForm">
                    <input type="hidden" id="editIndex">
                    <div class="mb-3">
                        <label class="form-label form-label-soft">代码</label>
                        <input type="tel" class="form-control" id="inputCode" maxlength="6" placeholder="例如 161725">
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label form-label-soft">份额</label>
                            <input type="number" class="form-control" id="inputShares" placeholder="0">
                        </div>
                        <div class="col-6">
                            <label class="form-label form-label-soft">成本</label>
                            <input type="number" class="form-control" id="inputCost" placeholder="选填">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label form-label-soft">分组</label>
                        <div class="smart-input-group dropdown">
                            <input type="text" class="form-control" id="inputGroup" placeholder="输入或选择..." autocomplete="off">
                            <button type="button" class="smart-arrow-btn" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-chevron-down"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end w-100 shadow-sm border-0" id="groupDropdownList"></ul>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top-0 px-4 pb-4">
                <button type="button" class="btn btn-light text-danger me-auto d-none" id="btnDelete" data-action="delete-fund">删除</button>
                <button type="button" class="btn px-4 btn-save-fund" data-action="save-fund">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="importModal" tabindex="-1" data-view="upload">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg modal-shell">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold modal-title-main">截图导入</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <div class="screenshot-import" id="screenshotImportArea">
                    <div class="screenshot-import-head">
                        <div>
                            <div class="screenshot-import-status" id="importStatus">支持批量选择基金持有页截图</div>
                        </div>
                        <label class="screenshot-import-btn" for="importImageInput">
                            <i class="bi bi-image"></i>
                            <span>选择截图</span>
                        </label>
                        <input type="file" id="importImageInput" class="d-none" accept="image/*" multiple>
                    </div>
                    <div class="ocr-progress d-none" id="importProgress">
                        <div class="ocr-progress-bar" id="importProgressBar"></div>
                    </div>
                </div>
                <div class="import-results d-none" id="importResults"></div>
            </div>
            <div class="modal-footer border-top-0 px-4 pb-4 d-none" id="importFooter">
                <div class="import-footer-actions">
                    <button type="button" class="import-footer-btn import-footer-btn-secondary" data-action="reset-import" id="btnImportReset">
                        <span>重新选择</span>
                    </button>
                    <button type="button" class="import-footer-btn import-footer-btn-primary" data-action="add-import-selected" id="btnImportConfirm">
                        <span>确认归类</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade mobile-more-modal" id="mobileMoreModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg modal-shell">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold modal-title-main">更多操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <div class="mobile-more-actions">
                    <button type="button" class="mobile-more-action" data-action="refresh-data" data-bs-dismiss="modal">
                        <i class="bi bi-arrow-clockwise"></i>
                        <span>刷新净值</span>
                    </button>
                    <button type="button" class="mobile-more-action" data-action="export-analysis-csv" data-bs-dismiss="modal">
                        <i class="bi bi-file-earmark-spreadsheet"></i>
                        <span>导出表格</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<button class="fab-btn" data-action="open-add"><i class="bi bi-plus-lg"></i></button>

<nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="移动端底部导航"></nav>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/storage.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/state.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/utils.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/logic.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/data.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/ocr.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/ui.js', v=asset_version) }}"></script>
<script defer src="{{ url_for('static', filename='js/dashboard/main.js', v=asset_version) }}"></script>

</body>
</html>
